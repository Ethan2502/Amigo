; Amigo firmware -- PlatformIO project config
; Board: custom ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB octal PSRAM)

[env:amigo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The stock esp32-s3-devkitc-1 definition is the N8 variant (8MB flash, no
; PSRAM). Amigo uses N16R8, so override both or you lose 8MB and all PSRAM.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi ; octal PSRAM (N16R8)
board_build.partitions = default_16MB.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---- TFT_eSPI configuration (avoids editing User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=12
    -DTFT_DC=13
    -DTFT_RST=8
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
